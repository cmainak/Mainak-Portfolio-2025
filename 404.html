<!DOCTYPE html>
<html lang="en" class="scroll-smooth overflow-x-hidden">
<head>

  <!-- SEO: Primary Meta Tags -->
  <title>404 - Page Not Found | Mainak Chakraborty</title>

  <meta name="description" content="Oops! The page you're looking for doesn't exist.">

  <!-- Favicon -->

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Chakra Petch', 'sans-serif'],
          },
          colors: {
            primary: {
              500: '#02437D',
              600: '#023666',
            },
            accent: {
              500: '#FF9933',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Smooth scroll behavior */
    @media (prefers-reduced-motion: no-preference) {
      html {
        scroll-behavior: smooth;
      }
    }

    /* Floating animation for 404 number */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    .float-animation {
      animation: float 3s ease-in-out infinite;
    }

    /* Glitch effect for 404 */
    @keyframes glitch {
      0% {
        text-shadow: 2px 2px #02437D, -2px -2px #FF9933;
      }
      25% {
        text-shadow: -2px 2px #FF9933, 2px -2px #02437D;
      }
      50% {
        text-shadow: 2px -2px #02437D, -2px 2px #FF9933;
      }
      75% {
        text-shadow: -2px -2px #FF9933, 2px 2px #02437D;
      }
      100% {
        text-shadow: 2px 2px #02437D, -2px -2px #FF9933;
      }
    }

    .glitch:hover {
      animation: glitch 0.3s ease-in-out;
    }
  </style>
</head>

<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-sans antialiased overflow-x-hidden">

<!-- 404 Illustration -->
<div class="mb-8">

      <!-- Error Message -->
