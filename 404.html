<!DOCTYPE html>
<html lang="en" class="scroll-smooth overflow-x-hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 - Page Not Found | Mainak Chakraborty</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/Logo2.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Bangers&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Chakra Petch', 'sans-serif'], sfx: ['Bangers', 'cursive'] },
          colors: {
            manga: { ink: '#0D0D0D', panel: '#FFFEF5', blue: '#00B4FF', pink: '#FF006E', purple: '#9B4DCA' }
          }
        }
      }
    }
  </script>

  <style>
    .manga-panel { border: 3px solid #0D0D0D; box-shadow: 6px 6px 0px 0px #0D0D0D; background: #FFFEF5; }
    .dark .manga-panel { background: #0A0A0F; border-color: #FFFFFF; box-shadow: 6px 6px 0px 0px #FFFFFF; }
    .sfx { font-family: 'Bangers', cursive; -webkit-text-stroke: 2px #0D0D0D; paint-order: stroke fill; }
    .manga-halftone { background-image: radial-gradient(circle, #0D0D0D 1px, transparent 1px); background-size: 20px 20px; }
  </style>
</head>

<body class="bg-white text-manga-ink dark:bg-manga-ink dark:text-white font-sans antialiased transition-colors duration-300">

  <header role="banner">
    <nav class="fixed top-0 w-full z-40 bg-white/95 dark:bg-manga-ink/95 backdrop-blur-md border-b-3 border-manga-blue/20 transition-colors duration-300">
      <div class="h-1 w-full" style="background: repeating-linear-gradient(90deg, #00B4FF 0px, #00B4FF 12px, #FF006E 12px, #FF006E 14px, transparent 14px, transparent 28px);"></div>
      <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3 group">
          <img src="assets/img/Logo2.svg" alt="Logo" class="h-8 w-8">
          <span class="text-sm font-black tracking-widest uppercase">MAINAK CHAKRABORTY</span>
        </a>
        <a href="index.html" class="text-sm font-black uppercase border-b-2 border-manga-ink dark:border-white">HOME</a>
      </div>
    </nav>
  </header>

  <main class="min-h-screen flex items-center justify-center pt-24 pb-20 px-6">
    <div class="max-w-2xl w-full text-center animate-fade-in-up">
      
      <div class="manga-panel p-8 md:p-12 relative overflow-hidden">
        <div class="absolute inset-0 manga-halftone opacity-5 pointer-events-none"></div>
        
        <h1 class="sfx text-[10rem] leading-none text-white dark:text-manga-ink drop-shadow-[4px_4px_0_#FF006E] mb-6">404</h1>
        
        <h2 class="text-3xl font-black uppercase mb-4">Lost in the Multiverse?</h2>
        <p class="text-manga-ink/70 dark:text-white/70 font-bold mb-10 uppercase tracking-widest">
          The page you're looking for doesn't exist in this timeline.
        </p>

        <a href="index.html" 
           class="inline-flex items-center gap-2 px-8 py-4 bg-manga-blue text-manga-ink font-black uppercase tracking-wide border-3 border-manga-ink shadow-comic hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all">
          <i class="fas fa-home"></i> Back to HQ
        </a>
      </div>

    </div>
  </main>

  <script>
    // Simple dark mode toggle functionality if needed
  </script>
</body>
</html>
