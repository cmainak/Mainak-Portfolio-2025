<!DOCTYPE html>
<html lang="en" class="scroll-smooth overflow-x-hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mainak Chakraborty - AI Visual Storytelling</title>
  <meta name="description" content="A look into my prompt design process, translating real-life memories into high-energy manga and cinematic visual panels.">
  <meta name="author" content="Mainak Chakraborty">
  
  <link rel="icon" href="assets/img/Logo2.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Bangers&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Chakra Petch', 'sans-serif'],
            sfx:  ['Bangers', 'cursive'],
          },
          colors: {
            accent: { 500: '#FF9933' },
            manga: {
              ink:    '#0D0D0D',
              panel:  '#FFFEF5',
              blue:   '#00B4FF',
              pink:   '#FF006E',
              navy:   '#02437D',
            }
          },
          borderWidth: { '3': '3px' },
          boxShadow: {
            'comic':      '6px 6px 0px 0px #0D0D0D',
            'comic-hov':  '8px 8px 0px 0px #0D0D0D',
            'comic-navy': '4px 4px 0px 0px #02437D',
          }
        }
      }
    }
  </script>

  <style>
    /* ── Manga Base ── */
    .manga-halftone-navy {
      background-image: radial-gradient(circle, rgba(2,67,125,0.12) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    
    .sfx {
      font-family: 'Bangers', cursive;
      letter-spacing: 0.05em;
      -webkit-text-stroke: 2px #0D0D0D;
      paint-order: stroke fill;
    }
    
    .sfx-light {
      font-family: 'Bangers', cursive;
      letter-spacing: 0.05em;
      -webkit-text-stroke: 2px rgba(2,67,125,0.2);
      paint-order: stroke fill;
    }

    .manga-label {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      border: 2px solid #0D0D0D;
      background: #FF9933;
      color: #0D0D0D;
      padding: 4px 12px;
      display: inline-block;
      box-shadow: 3px 3px 0px 0px #0D0D0D;
    }

    .speech-bubble {
      position: relative;
      background: #FFFFFF;
      border: 3px solid #0D0D0D;
      border-radius: 14px;
      box-shadow: 4px 4px 0px 0px #0D0D0D;
      display: inline-block;
      padding: 10px 20px;
      color: #0D0D0D;
    }
    .speech-bubble::after  { content:''; position:absolute; bottom:-18px; left:24px; border:9px solid transparent; border-top-color:#0D0D0D; }
    .speech-bubble::before { content:''; position:absolute; bottom:-12px; left:26px; border:7px solid transparent; border-top-color:#FFFFFF; z-index:1; }

    /* ── Manga Panels ── */
    .manga-panel {
      border: 3px solid #0D0D0D;
      box-shadow: 6px 6px 0px 0px #0D0D0D;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: #FFFFFF;
    }
    .manga-panel:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px 0px #0D0D0D;
    }

    /* ── Utilities ── */
    #progress-bar {
      position: fixed; top: 0; left: 0; height: 6px;
      background: repeating-linear-gradient(90deg, #02437D 0px, #02437D 16px, #FF9933 16px, #FF9933 32px, #00B4FF 32px, #00B4FF 48px);
      width: 0%; z-index: 9998; transition: width 0.1s ease;
    }

    #loader { background: #FFFEF5; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s ease; }
    #loader.fade-out { opacity: 0; pointer-events: none; }

    @keyframes sfx-pop { 0%,100%{transform:scale(1) rotate(-2deg);} 50%{transform:scale(1.06) rotate(2deg);} }
    .sfx-animate { animation: sfx-pop 2.5s ease-in-out infinite; }
    
    #back-to-top.show { opacity: 1; visibility: visible; }
  </style>
</head>

<body class="bg-manga-panel text-manga-ink font-sans antialiased overflow-x-hidden">

  <div id="progress-bar" role="progressbar" aria-label="Page scroll progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

  <div id="loader" role="status" aria-live="polite">
    <div class="text-center space-y-3">
      <p class="sfx text-5xl sfx-animate" style="color:#02437D; -webkit-text-stroke:2px #FF9933;">INKING!</p>
      <p class="text-sm text-manga-ink/50 uppercase tracking-widest font-bold">Drafting panels... 🖋️</p>
    </div>
  </div>

  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-6 focus:py-3 focus:bg-manga-navy focus:text-white focus:outline-none focus:font-bold border-3 border-manga-ink">Skip to main content</a>

  <a href="work.html"
     class="fixed top-6 right-6 z-50 w-12 h-12
            bg-accent-500 text-manga-ink font-black
            border-3 border-manga-ink shadow-comic
            flex items-center justify-center
            hover:bg-manga-navy hover:text-white hover:shadow-none hover:translate-x-1 hover:translate-y-1
            transition-all duration-150 focus:outline-none"
     aria-label="Return to Work">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
      </svg>
  </a>

  <main id="main-content" role="main">

    <section id="stories" class="relative pt-24 pb-20 px-4 sm:px-6 lg:px-8 border-b-3 border-manga-ink bg-[#F9FAFB] overflow-hidden" aria-labelledby="stories-heading">
      
      <div class="absolute inset-0 manga-halftone-navy opacity-30 pointer-events-none"></div>
      
      <div class="absolute top-10 right-0 sm:right-10 pointer-events-none" aria-hidden="true">
        <span class="sfx-light text-[6rem] sm:text-[10rem] leading-none opacity-20" style="color:#FF9933;">DRAW!</span>
      </div>

      <div class="relative z-10 max-w-7xl mx-auto text-center">
        
        <div class="manga-label mb-5 mx-auto block w-fit" style="background:#02437D; color:#FF9933; box-shadow:3px 3px 0 #0D0D0D;">
          Generative Art — Exploring Midjourney
        </div>

        <div class="speech-bubble mb-8 inline-block mx-auto">
          <p class="text-xs font-black uppercase tracking-widest text-manga-ink">Prompt Design Gallery</p>
        </div>

        <h1 id="stories-heading" class="font-sfx text-5xl sm:text-6xl md:text-7xl leading-none text-white mb-6"
            style="-webkit-text-stroke:2px #0D0D0D; paint-order:stroke fill; color:#FF9933; text-shadow: 4px 4px 0px #0D0D0D;">
          AI VISUAL<br>STORYTELLING
        </h1>

        <p class="text-base sm:text-lg font-bold text-manga-ink/80 leading-relaxed max-w-2xl mx-auto border-l-4 border-r-4 px-4" style="border-color:#02437D;">
          A look into my prompt design process, where I use AI as a tool to translate real-life memories into high-energy manga and cinematic visual panels.
        </p>
      </div>
    </section>

    <section class="py-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 grid-flow-row-dense">
    
          <figure class="manga-panel flex flex-col">
            <img src="assets/img/Mainak Art/Mainak_TimeSquare_Comic.png" alt="Story 01" class="w-full h-full object-cover border-b-3 border-manga-ink" loading="lazy" />
          </figure>
          
          <figure class="manga-panel flex flex-col bg-accent-500">
            <img src="assets/img/Mainak Art/Comic_Manga_Mainak_2.png" alt="Story 19" class="w-full h-full object-cover border-b-3 border-manga-ink" loading="lazy" />
          </figure>
          
          <figure class="manga-panel flex flex-col">
            <img src="assets/img/Mainak Art/TC_1.png" alt="Story 02" class="w-full h-full object-cover border-b-3 border-manga-ink" loading="lazy" />
          </figure>
          
          <figure class="manga-panel flex flex-col bg-manga-pink">
            <img src="assets/img/Mainak Art/TC_2.png" alt="Story 03" class="w-full h-full object-cover border-b-3 border-manga-ink" loading="lazy" />
          </figure>
          
          <figure class="manga-panel flex flex-col">
            <img src="assets/img/Mainak Art/TC_3.png" alt="Story 04" class="w-full h-full object-cover border-b-3 border-manga-ink" loading="lazy" />
          </figure>
          
          <figure class="manga-panel flex flex-col sm:col-span-2 lg:col-span-3 bg-manga-navy">
            <img src="assets/img/Mainak Art/Football_Comic_1.png" alt="Story 19" class="w-full h-full object-cover border-b-3 border-manga-ink" loading="lazy" />
          </figure>
        
      </div>
    </section>

  </main>

  <button id="back-to-top"
          class="fixed bottom-6 right-6 sm:right-8 z-50 w-12 h-12 font-black border-3 border-manga-ink shadow-comic flex items-center justify-center opacity-0 invisible transition-all duration-300 hover:shadow-none hover:translate-x-1 hover:translate-y-1 focus:outline-none"
          style="background:#FF9933; color:#0D0D0D;"
          aria-label="Back to top">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
    </svg>
  </button>

  <script>
    // ── Loader ──
    window.addEventListener('load', function() {
      const loader = document.getElementById('loader');
      setTimeout(function() {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.style.display = 'none'; }, 300);
      }, 700); // Slightly longer for the comic feel
    });

    // ── Progress Bar ──
    function updateProgressBar() {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const progressBar = document.getElementById('progress-bar');
      if (progressBar) {
        progressBar.style.width = scrolled + '%';
        progressBar.setAttribute('aria-valuenow', Math.round(scrolled));
      }
    }
    window.addEventListener('scroll', updateProgressBar, { passive: true });

    // ── Back to Top ──
    const backToTopBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', function() {
      if (window.pageYOffset > 300) { 
        backToTopBtn.classList.add('show'); 
      } else { 
        backToTopBtn.classList.remove('show'); 
      }
    }, { passive: true });
    
    backToTopBtn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
</html>
